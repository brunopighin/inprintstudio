<!doctype html>
<html lang="es">
  <head>
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual'
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="In Print — Impresión fotográfica profesional. Fotos, fotolibros, cuadros, imanes y más." />
    <title>In Print — Impresión Fotográfica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #fff;
      }
      #preloader .logo {
        width: 140px;
        height: auto;
      }
      #preloader .bar-track {
        width: 160px;
        height: 3px;
        background: #e5e5e5;
        overflow: hidden;
        border-radius: 2px;
      }
      #preloader .bar-fill {
        width: 40%;
        height: 100%;
        background: #000;
        animation: preloader-slide 1.1s ease-in-out infinite;
      }
      @keyframes preloader-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <img class="logo" src="/logo.png" alt="In Print" />
      <div class="bar-track"><div class="bar-fill"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
